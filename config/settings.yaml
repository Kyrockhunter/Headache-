# config/settings.yaml
version: "4.1.1"

simulation:
  iterations: 10000
  random_seed: 42

feature_weights:
  turnovers: 0.45
  third_down: 0.35
  yards_per_pass: 0.30
  first_downs: 0.25
  sacks: 0.15
  penalties: 0.10

logging:
  level: INFO
  log_file: "logs/fantasy_v4.log"


consistency:
  min_games: 2
  min_mean_threshold: 0.5
  max_std_ratio: 5.0
  apply_weighting: true
